<script>

    async function geocodeCity(cityName) {
        if (!cityName) return null;

        const url = `https://nominatim.openstreetmap.org/search?city=${encodeURIComponent(cityName)}&country=Poland&format=json&limit=1`;
        
        try {
            const response = await fetch(url, {
                headers: { "Accept-Language": "pl" }
 
            });
            const data = await response.json();

            if (data.length === 0) return null;

            return {
                lat: parseFloat(data[0].lat),
                lng: parseFloat(data[0].lon)
            };

            
        } catch (err) {
            console.error("Bład geokodowania:", err);
            return null;
        }
    }

    document.getElementById("city").addEventListener("blur", async () => {
        const cityName = document.getElementById("city").value.trim();
        const coords = await geocodeCity(cityName);

    
    if (coords) {

         document.getElementById("lat").value = coords.lat;
         document.getElementById("lng").value = coords.lng;


        }
    });
    fetch("/me")
    .then(response => response.json())
    .then(user => {
        console.log("DANE Z /ME:", user);

        const list = user.instruments?.length
            ? user.instruments
            : [user.instrument, user.secinstrument].filter(Boolean); // starzy użytkownicy
        (list.length ? list : [""]).forEach(i => addInstrumentSelect(i));

        document.getElementById("name").value = user.name || "";
        document.getElementById("surname").value = user.surname || "";
        document.getElementById("city").value = user.city || "";
        document.getElementById("level").value = user.level || "";
        document.getElementById("lookingFor").value = user.lookingFor || "";
        document.getElementById("bio").value = user.bio || "";
        document.getElementById("instagram").value = user.instagram || "";
        document.getElementById("facebook").value = user.facebook || "";
        document.getElementById("spotify").value = user.spotify || "";
        document.getElementById("soundcloud").value = user.soundcloud || "";
        document.getElementById("currentAvatar").src = user.profilePicture || "/default-avatar.png";

        document.getElementById("profilePicture").addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById("currentAvatar").src = URL.createObjectURL(file);
            }
        });

        const userSkills = user.skills || [];
        document.querySelectorAll('input[name="skills"]').forEach(cb => {
            cb.checked = userSkills.includes(cb.value);
        });
        const userGenres = user.genres || [];
        document.querySelectorAll('input[name="genres"]').forEach(cb => {
            cb.checked = userGenres.includes(cb.value);
        });
    });
</script>
