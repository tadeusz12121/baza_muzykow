<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edytuj profil</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <form action="/edit-profile" method="POST">
        
        <input type="text" id="name" name="name" placeholder="Imię">

        <input type="text" id="surname" name="surname" placeholder="Nazwisko">

        <input type="text" id="city" name="city" placeholder="Miasto">

        <input type="text" id="instrument" name="instrument" placeholder="Instrument">


        <textarea class="l" 
            name="lookingFor"
            id="lookingFor"
            placeholder="Czego aktualnie szukasz"
        >
    </textarea>

        <button type="submit">Zapisz zmiany</button>
        
        <select id="level" name="level">
    <option value="początkujący">Początkujący</option>
    <option value="sredniozaawansowany">Średnio zaawansowany</option>
    <option value="zaawansowany">Zaawansowany</option>
</select>
    </form>
<script>
    fetch("/me")
    .then(response => response.json())
    .then(user => {



        console.log("DANE Z /ME:", user);

        document.getElementById("name").value = user.name || "";
        document.getElementById("surname").value = user.surname || "";
        document.getElementById("city").value = user.city || "";
        document.getElementById("instrument").value = user.instrument || "";
        document.getElementById("level").value = user.level || "";
        document.getElementById("lookingFor").value = user.lookingFor || "";

    });
</script>
</body>
</html>
