<script>
    fetch("/me")
    .then(response => response.json())
    .then(user => {


 
        console.log("DANE Z /ME:", user);
        
        document.getElementById("name").value = user.name || "";
        document.getElementById("surname").value = user.surname || "";
        document.getElementById("city").value = user.city || "";
        document.getElementById("instrument").value = user.instrument || "";
        document.getElementById("secinstrument").value = user.secinstrument || "";
        document.getElementById("level").value = user.level || "";
        document.getElementById("lookingFor").value = user.lookingFor || "";
        document.getElementById("currentAvatar").src = user.profilePicture || "/default-avatar.png";
        document.getElementById("profilePicture").addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById("currentAvatar").src = URL.createObjectURL(file);
                
            }
        });

        const userSkills = user.skills || [];

        document.querySelectorAll('input[name="skills"]').forEach(cb => {
         cb.checked = userSkills.includes(cb.value);
    });
        const userGenres = user.genres || [];
        document.querySelectorAll('input[name="genres"]').forEach(cb => {
            cb.checked = userGenres.includes(cb.value);
        });
       

    });
</script>
