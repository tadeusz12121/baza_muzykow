<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <header>
    <nav class="navbar">

        <div class="logo">JAMLY</div>

        <button class="hamburger" onclick="document.querySelector('.nav-links').classList.toggle('open')">
             ☰
        </button>

        <div class="nav-links">
            <a href="/index.html">Main page</a>
            <a href="/musicians.html">Musicians</a>
            <a href="/group-chat.html">Czat społecznośći</a>
            <a href="/contact.html">Contact</a>
            <a href="/logowanie.html">Sign in</a>
            
        
</div>

    </nav>
 </header>
 <div class="chat-page">
    <div class="chat">

        <div class="chat-header">
            <h2>CHAT GRUPOWY</h2>
        </div>

        <div class="messages" id="messages">

        </div>

        <form class="send" id="sendForm">
            <label for="imageInput" class="attach-label">📎</label>
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
            <img id="imagePreview" class="image-preview" style="display: none;">


            <input 
                type="text"
                id="messageInput"
                placeholder="Napisz wiadomość..."
                autocomplete="off"
                >
            <button type="submit">
                Wyślij
            </button>

        </form>
    </div>

    <div class="ad-panel">
        <p>Miejsce na reklamę</p>
    </div>
    <div class="ad-panel">
        <p>Miejsce na reklamę</p>
    </div>




 </div>


<script src="/socket.io/socket.io.js"></script>

<script>

    const socket = io();

    const messages = document.getElementById("messages");
    const form = document.getElementById("sendForm");
    const input = document.getElementById("messageInput");

    async function loadMessages() {

        const response = await fetch("/group-messages");

        const data = await response.json();

        data.forEach(message => {
            showMessage(message);
        });

        messages.scrollTop = messages.scrollHeight;


    }

    function showMessage(message) {
        const div = document.createElement("div");
        
        div.className = "message";

        const date = new Date(message.createdAt);

        const imageHTML = message.image
            ? `<img class="chat-image" src="${message.image}" alt="Zdjęcie">`
            : "";

        div.innerHTML = `
            

            <div class="text">
                ${message.message}
            </div>
            ${imageHTML}
            <div class="author">
                ${message.name} ${message.surname}
            </div>

            <div class="date">
                ${date.toLocaleTimeString("pl-PL", {
                    hour: "2-digit",
                    minute: "2-digit"
                })}
            </div>
        `;

        messages.appendChild(div);


    }
    const imageInput = document.getElementById("imageInput");

    const imagePreview = document.getElementById("imagePreview");

    imageInput.addEventListener("change", () => {
        const file = imageInput.files[0];

        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                imagePreview.src = e.target.result;
                imagePreview.style.display = "block";
            };
            reader.readAsDataURL(file);
        } else {
            imagePreview.style.display = "none";
            imagePreview.src = "";
        }
});

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const message = input.value.trim();
        const file = imageInput.files[0];
        if (!message && !file) {
            return;
        }
        let imageUrl = null;

        if (file) {
        const formData = new FormData();
        formData.append("image", file);

        const response = await fetch("/group-chat-upload", {
            method: "POST",
            body: formData
        });

        const data = await response.json();
        imageUrl = data.image;
    }

    socket.emit("group message", {
        message: message,
        image: imageUrl
    });

    input.value = "";
    imageInput.value = "";
    imagePreview.style.display = "none";
    imagePreview.src = "";
});

socket.on("group message", function(message) {
    showMessage(message);
    messages.scrollTop = messages.scrollHeight;
});

loadMessages();

</script>
  
</body>
</html>
