<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musicians</title>
</head>
<body>
    
    <h1>Musicians</h1>
    <button type="button" onclick="location.href='/logout'">
        Wyloguj się
    </button>
    <div id="filters">

        <select id="instrument">

            <option value="">Wszystkie Instrumenty</option>
            <option value="bass">Altówka</option>
            <option value="guitar">Akordeon</option>
            <option value="drums">Banjo</option>
            <option value="keys">Fortepian</option> 
            <option value="keys">Flet poprzeczny</option> 
            <option value="keys">Flet prosty</option>  
            <option value="keys">Gitara akustyczna</option>  
            <option value="keys">Gitara elektryczna</option>  
            <option value="keys">Gitara klasyczna</option>  
            <option value="keys">Gitara basowa</option>  
            <option value="keys">Gitara basowa(akustyczna)</option>  
            <option value="keys">Harmonijka ustna</option>  
            <option value="keys">Harfa</option>  
            <option value="keys">Klarnet</option>  
            <option value="keys">Kontrabas</option>  
            <option value="keys">Mandolina</option>  
            <option value="keys">Obój</option>  
            <option value="keys">Organy</option>  
            <option value="keys">Perkusja</option>  
            <option value="keys">Saksofon altowy</option>  
            <option value="keys">Saksofon barytonowy</option>  
            <option value="keys">Saksofon sopranowy</option>  
            <option value="keys">Syntezator</option>  
            <option value="keys">Tamburyn</option>  
            <option value="keys">Trąbka</option>  
            <option value="keys">Ukulele</option>  
            <option value="keys">Wibrafon</option>  
            <option value="keys">Wokal Żeński</option>  
            <option value="keys">Wokal Męski</option>  
            <option value="keys">Wiolonczela</option>  
            <option value="keys">Skrzypce</option>  
            <option value="keys">Puzon</option>  
            <option value="keys">Róg</option>  
            <option value="keys">Rhodes/pianino elektryczne</option>  
            <option value="keys">Cajon</option>  
            
        </select>

        <select id="level">

            <option value="">Wszystkie Poziomy</option>
            <option value="początkujący">Początkujący</option>
            <option value="sredniozaawansowany">Średnio zaawansowany</option>
            <option value="zaawansowany">Zaawansowany</option>

        </select>

        <input type="text" id="city" placeholder="Miasto">

        <button type="button" id="search">Szukaj</button>

    </div>
    <div id="musicians"></div>





<script>
    function loadMusicians() {

        const instrument = document.getElementById("instrument").value;
        const level = document.getElementById("level").value;
        const city = document.getElementById("city").value;

        const params = new URLSearchParams();

        if (instrument) {
            params.append("instrument", instrument);
        }
        if (level) {
            params.append("level", level);

        }
        if (city) {
            params.append("city", city);
            
        }
        console.log(params.toString());

        fetch("/musicians?" + params.toString())
        .then(response => response.json())
        .then(musicians => {

            const container = document.getElementById("musicians");

            container.innerHTML = "";

            musicians.forEach(musician => {

                const card = document.createElement("div");

                card.innerHTML = `
                <h2>${musician.name} ${musician.surname}</h2>
                <p>Miasto: ${musician.city}</p>
                <p>Instrument: ${musician.instrument}</p>
                <p>Poziom: ${musician.level}</p>
                `;
                container.appendChild(card);
            });
        });
    }
        document.getElementById("search").addEventListener("click", loadMusicians);
        console.log("skrypt działa");
        loadMusicians();
    
</script>
</body>
</html>
