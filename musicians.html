<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musicians</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    
    <h1>Musicians</h1>
    <h1><p id="loggedUser"></p></h1>
    <script>

        fetch("/me") 
            .then(response => response.json())
            .then(user => {
                document.getElementById("loggedUser").textContent =
                `Zalogowano jako: ${user.name} ${user.surname}`;
            })
        
        
        
        

    </script>
    <button type="button" onclick="location.href='/logout'">
        Wyloguj sie
    </button>
    <button type="button" onclick="location.href='/edit-profile.html'">
        Edytuj profil
    </button>
    
    <div class="form-card">
    <div id="filters">

        <select id="instrument">
             <option value="">Wszystkie Instrumenty</option>
           <option value="Altówka">Altówka</option>
            <option value="Akordeon">Akordeon</option>
            <option value="Banjo">Banjo</option>
            <option value="Fortepian">Fortepian</option> 
            <option value="Flet poprzeczny">Flet poprzeczny</option> 
            <option value="Flet prosty">Flet prosty</option>  
            <option value="Gitara akustyczna">Gitara akustyczna</option>  
            <option value="Gitara elektryczna">Gitara elektryczna</option>  
            <option value="Gitara klasyczna">Gitara klasyczna</option>  
            <option value="Gitara basowa">Gitara basowa</option>  
            <option value="Gitara basowa(akustyczna)">Gitara basowa(akustyczna)</option>  
            <option value="Harmonijka ustna">Harmonijka ustna</option>  
            <option value="Harfa">Harfa</option>  
            <option value="Klarnet">Klarnet</option>  
            <option value="Kontrabas">Kontrabas</option>  
            <option value="Mandolina">Mandolina</option>  
            <option value="Obój">Obój</option>  
            <option value="Organy">Organy</option>  
            <option value="Perkusja">Perkusja</option>  
            <option value="Saksofon altowy">Saksofon altowy</option>  
            <option value="Saksofon barytonowy">Saksofon barytonowy</option>  
            <option value="Saksofon sopranowy">Saksofon sopranowy</option>  
            <option value="Syntezator">Syntezator</option>  
            <option value="Tamburyn">Tamburyn</option>  
            <option value="Trąbka">Trąbka</option>  
            <option value="Ukulele">Ukulele</option>  
            <option value="Wibrafon">Wibrafon</option>  
            <option value="Wokal Żeński">Wokal Żeński</option>  
            <option value="Wokal Męski">Wokal Męski</option>  
            <option value="Wiolonczela">Wiolonczela</option>  
            <option value="Skrzypce">Skrzypce</option>  
            <option value="Puzon">Puzon</option>  
            <option value="Róg">Róg</option>  
            <option value="Rhodes/pianino elektryczne">Rhodes/pianino elektryczne</option>  
            <option value="Cajon">Cajon</option>  
            
        </select>

        <select id="level">

            <option value="">Wszystkie Poziomy</option>
            <option value="początkujący">Początkujący</option>
            <option value="sredniozaawansowany">Średnio zaawansowany</option>
            <option value="zaawansowany">Zaawansowany</option>

        </select>

        <input type="text" id="city" placeholder="Miasto">

        <button type="button" id="search">Szukaj</button>

    </div>
    <div id="musicians"></div>

</div>



<script>
    
        fetch("/me")
            .then(response => response.json())
            .then(user => {
                document.getElementById("loggedUser").textContent =
                  `Zalogowano jako: ${user.name} ${user.surname} `;
            });
    function loadMusicians() {

        const instrument = document.getElementById("instrument").value;
        const level = document.getElementById("level").value;
        const city = document.getElementById("city").value;




        const params = new URLSearchParams();


        
        if (instrument) {
            params.append("instrument", instrument);
        }
        if (level) {
            params.append("level", level);

        }
        if (city) {
            params.append("city", city);
            
        }
        console.log(params.toString());

        fetch("/musicians?" + params.toString())
        .then(response => response.json())
        .then(musicians => {

            const container = document.getElementById("musicians");

            container.innerHTML = "";

            musicians.forEach(musician => {

                const card = document.createElement("div");
                card.className = "musician-card";

                card.innerHTML = `
    <div class="whole-card">
    <div class="musician-header">
        <img 
        class="musician-avatar"
        src="${musician.profilePicture || '/default-avatar.png'}"
        alt="Zdjęcie profilowe"
    >
        <div class="name">
            <h2>${musician.name} ${musician.surname}</h2>
            <p class="city">📍 ${musician.city}</p>
        </div>
    </div>

    <div class="musician-main">
        <div class="info:">
            <span class="label">Instrument: </span>
            <span>${musician.instrument}</span>
        </div>
    </div>
        <div class="info">
            <div class="lev">
            <span class="label">Poziom:</span>
          <div class="level-dots">
            <span class="${musician.level ==='początkujący' || musician.level === 'sredniozaawansowany' || musician.level ==='zaawansowany' ? 'active' : '' }"></span>
            <span class="${musician.level === 'sredniozaawansowany' || musician.level === 'zaawansowany' ? 'active' : ''}"></span>
            <span class="${musician.level === 'zaawansowany' ? 'active' : ''}"></span>
        </div> 
        </div>
        <div class="sectio_v2">
        
    <span>${musician.lookingFor || "Nic nie podano"}</span>
    </div>
       
    <div class="section">
        <h3>O mnie:</h3>
        <p>${musician.bio || "Brak opisu"}</p>
    </div>

    <div class="section">
        <h3>Umiejętności:</h3>
        <div class="tags">
            ${
                musician.skills
                ? musician.skills.map(skill => `<span>${skill}</span>`).join(", ")
                : "<span>Brak</span>"
            }
        </div>
    </div>

    <div class="section">
        <h3>Gatunki:</h3>
        <div class="tags">
            ${
                musician.genres
                ? musician.genres.map(genre => `<span>${genre}</span>`).join(", ")
                : "<span>Brak</span>"
            }
        </div>
    </div>

    <div class="contact">
        ${
            musician.facebook
            ? `<a href="${musician.facebook}" target="_blank">Facebook</a>`
            : ""
        }

        ${
            musician.instagram
            ? `<a href="${musician.instagram}" target="_blank">Instagram</a>`
            : ""
        }
    </div>
    </div>
`;
                container.appendChild(card);
            });
        });
    }
        document.getElementById("search").addEventListener("click", loadMusicians);
        console.log("skrypt działa");
        loadMusicians();
    
</script>
</body>
</html>
