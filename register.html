<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rejestracja</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
 <header>
    <nav class="navbar">

        <div class="logo">JAMLY</div>

        <button class="hamburger" onclick="document.querySelector('.nav-links').classList.toggle('open')">
             ☰
        </button>

        <div class="nav-links">
            <a href="/index.html">Main page</a>
            <a href="/musicians.html">Musicians</a>
            <a href="/group-chat.html">Czat społeczności</a>
            <a href="/">Contact</a>
            <a href="/logowanie.html">Sign in</a>
            
        
</div>

    </nav>
 </header>
   

    <h2>Stwórz swoje konto i znajdź ludzi do wspolnego grania</h2>
   
     

<div class="form-card">


    
    <form action="/register-account" method="POST" enctype="multipart/form-data">
    
        <label for="name">Nazwa użytkownika:</label>
        <input type="text" name="name" required placeholder="Imię">
         <input type="text" name="surname" required placeholder="Nazwisko">
        <label for="email">Email:</label>
        <input type="email" name="email" required placeholder="Email">
        <label for="password">Hasło: </label>
        <input type="password" name="password" required placeholder="Hasło">
        <label for="profilePicture">Zdjęcie profilowe</label>
        <input 

            type="file"
            id="profilePicture"
            name="profilePicture"
          
            accept="image/*"
        >
        <label style="display:flex; align-items:center; gap:8px; font-size:12px;">
        <input type="checkbox" name="terms" required>
         Akceptuję <a href="/regulamin.html" target="_blank">regulamin</a> i <a href="/polityka-prywatnosci.html" target="_blank">politykę prywatności</a>
        </label>
    
        <button type="submit">Zarejestruj się</button>
    </form>
    
     <h3>pomagamy muzykom w szukaniu muzyków</h3>
</div>

</body>
</html>
