<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muzconecct</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <form action="/register" method="POST">

          <label for="bio">Napisz coś o sobie:</label>
        <input type="text" id="bio" name="bio" placeholder="Opisz się">
        
        <input type="text" name="city" placeholder="Miasto">
        <label for="instrument">Wybierz instrument:</label>
       <select id="instrument" name="instrument">
      
        <option value="">Wszystkie Instrumenty</option>
            <option value="Altówka">Altówka</option>
            <option value="Akordeon">Akordeon</option>
            <option value="Banjo">Banjo</option>
            <option value="Fortepian">Fortepian</option> 
            <option value="Flet poprzeczny">Flet poprzeczny</option> 
            <option value="Flet prosty">Flet prosty</option>  
            <option value="Gitara akustyczna">Gitara akustyczna</option>  
            <option value="Gitara elektryczna">Gitara elektryczna</option>  
            <option value="Gitara klasyczna">Gitara klasyczna</option>  
            <option value="Gitara basowa">Gitara basowa</option>  
            <option value="Gitara basowa(akustyczna)">Gitara basowa(akustyczna)</option>  
            <option value="Harmonijka ustna">Harmonijka ustna</option>  
            <option value="Harfa">Harfa</option>  
            <option value="Klarnet">Klarnet</option>  
            <option value="Kontrabas">Kontrabas</option>  
            <option value="Mandolina">Mandolina</option>  
            <option value="Obój">Obój</option>  
            <option value="Organy">Organy</option>  
            <option value="Perkusja">Perkusja</option>  
            <option value="Saksofon altowy">Saksofon altowy</option>  
            <option value="Saksofon barytonowy">Saksofon barytonowy</option>  
            <option value="Saksofon sopranowy">Saksofon sopranowy</option>  
            <option value="Syntezator">Syntezator</option>  
            <option value="Tamburyn">Tamburyn</option>  
            <option value="Trąbka">Trąbka</option>  
            <option value="Ukulele">Ukulele</option>  
            <option value="Wibrafon">Wibrafon</option>  
            <option value="Wokal Żeński">Wokal Żeński</option>  
            <option value="Wokal Męski">Wokal Męski</option>  
            <option value="Wiolonczela">Wiolonczela</option>  
            <option value="Skrzypce">Skrzypce</option>  
            <option value="Puzon">Puzon</option>  
            <option value="Róg">Róg</option>  
            <option value="Rhodes/pianino elektryczne">Rhodes/pianino elektryczne</option>  
            <option value="Cajon">Cajon</option>  
       
    </select>
        <label for="level">Wybierz poziom zaawansowania:</label>
        <select id="level" name="level"> 
            <option value="początkujący">Początkujący</option>
            <option value="sredniozaawansowany">Średnio zaawansowany</option>
            <option value="zaawansowany">Zaawansowany</option>
        

        </select>

    <p>Wybierz swoje umiejętności:</p>

    <label>
        <input type="checkbox" name="skills" value="gra ze słuchu"> 
        Gra ze słuchu
    </label>
     <label>
        <input type="checkbox" name="skills" value="słuch absolutny"> 
        Słuch absolutny
    </label>
    <label>
        <input type="checkbox" name="skills" value="czytanie nut"> 
        Czytanie nut
    </label>
    
     <label>
        <input type="checkbox" name="skills" value="Improwizacja"> 
        Improwizacja
    </label>
     <label>
        <input type="checkbox" name="skills" value="Umiejetnosc grania w sekcji"> 
        Umiejętność grania w sekcji
    </label>
     <label>
        <input type="checkbox" name="skills" value="Znajomość teorii muzyki"> 
        Znajomość teorii muzyki
    </label>
     <label>
        <input type="checkbox" name="skills" value="tworzenie aranacji"> 
        Tworzenie aranacji
    </label>
    
    
    <p>Gatunki muzyczne:</p>
    <label>
        <input type="checkbox" name="genres" value="rock"> Rock
    </label>

    <label>
        <input type="checkbox" name="genres" value="blues">Blues
    </label>
    <label>
        <input type="checkbox" name="genres" value="jazz"> Jazz
    </label>
    <label>
        <input type="checkbox" name="genres" value="fusion"> Fusion
    </label>
    <label>
        <input type="checkbox" name="genres" value="funk"> Funk
    </label>
    <label>
        <input type="checkbox" name="genres" value="Pop"> Pop
    </label>
    <label>
        <input type="checkbox" name="genres" value="Metal"> Metal
    </label>
    <label>
        <input type="checkbox" name="genres" value="Punk"> Punk
    </label>
    <label>
        <input type="checkbox" name="genres" value="Indie"> Indie
    </label>
    <label>
        <input type="checkbox" name="genres" value="Alternative"> Alternative
    </label>
    <label>
        <input type="checkbox" name="genres" value="soul"> Soul
    </label>
    <label>
        <input type="checkbox" name="genres" value="R&B"> R&B
    </label>
    <label>
        <input type="checkbox" name="genres" value="Reggae"> Reggae
    </label>
    <label>
        <input type="checkbox" name="genres" value="Country"> Country
    </label>
    <label>
        <input type="checkbox" name="genres" value="Folk"> Folk
    </label>
    <label>
        <input type="checkbox" name="genres" value="Muzyka klasyczna"> Muzyka klasyczna
    </label>

        <button type="submit">Zarejestruj</button>

    </form>
</body>
</html>
