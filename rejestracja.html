     <script>
        const cityInput = document.getElementById("city");
        const citySuggestions = document.getElementById("citySuggestions");

        let cities = [];

        fetch("/cities.json")
            .then(response => response.json())
            .then(data => {
                cities = data;
            });
        cityInput.addEventListener("input", () => {
            const value = cityInput.value.toLowerCase().trim();

            citySuggestions.innerHTML = "";

            if (value.length < 2) return;

            const results = cities
                .filter(city => city.toLowerCase().startsWith(value))
                .slice(0, 8);

            results.forEach(city => {
                const option = document.createElement("div");

                option.textContent = city;

                option.addEventListener("click", () => {
                    cityInput.value = city;
                    citySuggestions.innerHTML = "";

                });

                citySuggestions.appendChild(option);

            });
        });
        async function geocodeCity(city) {
    const response = await fetch(
        `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(city)}&limit=1`
    );

    const data = await response.json();

    if (data.length > 0) {
        document.getElementById("lat").value = data[0].lat;
        document.getElementById("lng").value = data[0].lon;

        console.log("Współrzędne:", data[0].lat, data[0].lon);
    }
}
const form = document.querySelector("form");



form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const city = cityInput.value;

    await geocodeCity(city);

    form.submit();
});

    </script>
